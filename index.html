        /* 特效設定 */
        .effect-earthquake { animation: gentle-quake 0.15s infinite; border-color: var(--earthquake-color) !important; }
        @keyframes gentle-quake { 0%, 100% { transform: translateX(1px); } 50% { transform: translateX(-1px); } }
        .effect-typhoon { animation: wind 3s infinite ease-in-out; border-color: var(--typhoon-color) !important; }
        @keyframes wind { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(0.6deg) translateX(5px); } 75% { transform: rotate(-0.6deg) translateX(-5px); } }
        .effect-fire { animation: fire-glow 1s infinite alternate; border-color: var(--fire-color) !important; }
        @keyframes fire-glow { from { box-shadow: 0 0 10px rgba(231, 76, 60, 0.2); } to { box-shadow: 0 0 30px rgba(231, 76, 60, 0.5); } }
        .effect-boss { animation: boss-pulse 2s infinite; border-color: var(--boss-color) !important; background: #f4eef8 !important; }
        @keyframes boss-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.01); box-shadow: 0 0 40px rgba(142, 68, 173, 0.4); } 100% { transform: scale(1); } }

        #smoke-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle, transparent 20%, rgba(80,80,80,0.6) 100%); pointer-events: none; display: none; z-index: 5; }

        /* 介面組件 */
        .explanation-card { text-align: left; background: #fff; border-radius: 15px; padding: 25px; margin: 20px 0; border-left: 10px solid #ccc; }
        .explanation-card.earthquake { border-left-color: var(--earthquake-color); }
        .explanation-card.typhoon { border-left-color: var(--typhoon-color); }
        .explanation-card.fire { border-left-color: var(--fire-color); }
        .explanation-card.boss { border-left-color: var(--boss-color); }
        .scene-display { font-size: 1.5rem; font-weight: bold; padding: 30px; background: #fff9db; border-radius: 15px; margin-bottom: 20px; line-height: 1.4; }
        .option-btn { padding: 15px; font-size: 1.15rem; background: white; border: 2px solid #eee; border-radius: 12px; cursor: pointer; transition: 0.2s; margin-bottom: 12px; width: 100%; }
        .option-btn:hover { background: #f0f7ff; border-color: var(--typhoon-color); transform: translateY(-2px); }
        .nav-btn { padding: 15px 45px; font-size: 1.3rem; background: var(--success-color); color: white; border: none; border-radius: 50px; cursor: pointer; font-weight: bold; }

    { key: "typhoon", name: "颱風", effect: "effect-typhoon", explanation: `<div class="explanation-card typhoon"><ul><li><span class="tip-tag">物資儲備</span> 準備 3 日份乾糧飲水。</li><li><span class="tip-tag">避險</span> 絕不去海邊或山區。</li></ul></div>` },
    { key: "fire", name: "火災", effect: "effect-fire", explanation: `<div class="explanation-card fire"><ul><li><span class="tip-tag">低姿勢</span> 濃煙中爬行找新鮮空氣。</li><li><span class="tip-tag">燙手不開門</span> 摸門把燙手代表門後有火。</li></ul></div>` },
    { key: "boss", name: "最終任務", effect: "effect-boss", explanation: `<div class="explanation-card boss"><p>恭喜來到最後一關！這裡將測試你的綜合防災直覺，只有最冷靜的防災王能拿到滿分！</p></div>` }
];

let curStageIdx = 0, curQIdx = 0, totalScore = 0;
let selectedQuestions = [];
let history = [];

function showExplanation(idx) {
    curStageIdx = idx;
    document.getElementById('home-screen').classList.add('hidden');
    document.getElementById('play-screen').classList.add('hidden');
    document.getElementById('game-board').className = "";
    document.getElementById('smoke-overlay').style.display = 'none';

    const screen = document.getElementById('explain-screen');
    screen.classList.remove('hidden');
    document.getElementById('explain-title').innerText = `【${stages[idx].name}任務】重點摘要`;
    document.getElementById('explain-container').innerHTML = stages[idx].explanation;

    const pool = [...questionBank[stages[idx].key]];
    const count = (stages[idx].key === 'boss') ? 1 : 3;
    selectedQuestions = pool.sort(() => Math.random() - 0.5).slice(0, count);
}

function startStage() {
    document.getElementById('explain-screen').classList.add('hidden');
    document.getElementById('play-screen').classList.remove('hidden');
    curQIdx = 0;
    document.getElementById('game-board').className = stages[curStageIdx].effect;
    if(stages[curStageIdx].key === "fire") document.getElementById('smoke-overlay').style.display = 'block';
    loadQuestion();
}

function loadQuestion() {
    const qData = selectedQuestions[curQIdx];
    document.getElementById('current-stage-name').innerText = stages[curStageIdx].key === 'boss' ? "🌟 最終任務" : `${stages[curStageIdx].name}測驗 (${curQIdx+1}/3)`;
    document.getElementById('scene-text').innerText = qData.q;

    const list = document.getElementById('option-list');
    list.innerHTML = "";
    qData.a.forEach((text, i) => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = text;
        btn.onclick = () => checkAnswer(i);
        list.appendChild(btn);
    });
}

function checkAnswer(idx) {
    const qData = selectedQuestions[curQIdx];
    const isCorrect = (idx === qData.correct);
    const feedback = document.getElementById('feedback');
    feedback.style.display = 'block';
    
    if(isCorrect) {
        feedback.innerText = "正確！✨";
        feedback.style.backgroundColor = "#2ecc71";
        totalScore += 10;
        document.getElementById('live-score').innerText = totalScore;
    } else {
        feedback.innerText = "答錯了 😭";
        feedback.style.backgroundColor = "#e74c3c";
    }

    history.push({ q: qData.q, userAns: qData.a[idx], correctAns: qData.a[qData.correct], isCorrect: isCorrect });

    setTimeout(() => {
        feedback.style.display = 'none';
        curQIdx++;
        if(curQIdx < selectedQuestions.length) {
            loadQuestion();
        } else if(curStageIdx < stages.length - 1) {
            showExplanation(curStageIdx + 1);
        } else {
            showEnd();
        }
    }, 1100);
}

function showEnd() {
    document.getElementById('play-screen').classList.add('hidden');
    document.getElementById('end-screen').classList.remove('hidden');
    document.getElementById('game-board').className = "";
    document.getElementById('smoke-overlay').style.display = 'none';
    document.getElementById('final-score').innerText = totalScore;

    const tbody = document.querySelector('#review-body tbody');
    tbody.innerHTML = "";
    history.forEach(item => {
        const statusClass = item.isCorrect ? "status-correct" : "status-wrong";
        const userDisplay = item.isCorrect ? item.userAns : `${item.userAns} (X)`;
        tbody.innerHTML += `
            <tr>
                <td>${item.q}</td>
                <td>
                    <span class="${statusClass}">${userDisplay}</span>
                    ${!item.isCorrect ? `<span class="correct-hint">✅ 正確做法：${item.correctAns}</span>` : ""}
                </td>
            </tr>`;
    });

    let title = totalScore === 100 ? "🏆 終極防災守護神" : totalScore >= 70 ? "🎖️ 防災指揮官" : "🛡️ 實習救難員";
    document.getElementById('rank-title').innerText = title;
}
